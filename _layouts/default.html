<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{% if page.title and page.title != 'Home' %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>
<body>
<a class="btn ghost" href="#main" style="position:absolute;left:-9999px">Skip to content</a>

<header class="site-header">
  <div class="wrap">
    <a class="brand" href="{{ '/' | relative_url }}">
      <svg class="mark" width="30" height="30" viewBox="0 0 30 30" aria-hidden="true">
        <rect x="1" y="1" width="28" height="28" rx="7" fill="var(--ink)"/>
        <path d="M9 21V9h4.6c2.5 0 4 1.3 4 3.5S16.1 16 13.6 16H11.7v5H9z" fill="var(--paper)"/>
        <circle cx="21" cy="11" r="2.1" fill="var(--accent)"/>
      </svg>
      <span><b>{{ site.title }}</b><span>{{ site.tagline | default: 'Tools &amp; guides' }}</span></span>
    </a>
    <button class="nav-toggle" aria-expanded="false" aria-controls="site-nav">Menu</button>
    <nav class="nav" id="site-nav" aria-label="Main">
      {%- for item in site.data.nav %}
      <a href="{{ item.url | relative_url }}"{% if page.url == item.url or page.url contains item.match %} aria-current="page"{% endif %}>{{ item.name }}</a>
      {%- endfor %}
    </nav>
  </div>
</header>

<main id="main">
  {{ content }}
</main>

<footer class="site-footer">
  <div class="wrap">
    <p>{{ site.footer_note }}</p>
    <div class="foot-links">
      {%- for item in site.data.nav %}
      <a href="{{ item.url | relative_url }}">{{ item.name }}</a>
      {%- endfor %}
    </div>
  </div>
</footer>

<script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
</body>
</html>
