- name: Oral Advocacy Guide
  file: oral-advocacy-guide.docx
  page: /guides/oral-advocacy/
  format: Word document
  size: 32 KB
  updated: September 2026
  summary: >-
    Practical guidance for preparing and delivering an oral argument in a moot: working out the
