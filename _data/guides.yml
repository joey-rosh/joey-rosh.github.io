# Guides shown on the home page and the Guides page.
# page: the web version (optional).  file: the download inside /files/ (optional).
- name: Arbitration Moot Advocacy Guide
  page: /guides/arbitration-moot/
  file: oral-advocacy-guide.docx
  format: Word document
  size: 32 KB
  updated: September 2026
  summary: >-
    Preparing and delivering an oral argument in an arbitration moot, where you address a Tribunal
    rather than a court. Written for the contract law moot workshop.
  contents:
    - Starting from the order you are asking for, and building a theory of the case
    - The 75-word test for a core submission
    - Structure of an address: appearance, roadmap, submissions, conclusion
    - Forms of address for an arbitral Tribunal
    - Handling questions, timing, handovers and a pre-hearing checklist

- name: Court Moot Advocacy Guide
  page: /guides/court-moot/
  format: Web page
  updated: September 2026
  summary: >-
    The same approach, adapted for a moot heard by a judge in court: the courtesies, the forms of
    address and the more formal register that courtroom advocacy uses.
  contents:
    - Everything in the arbitration guide, in its court form
    - Announcing your appearance, and addressing one judge or a bench
    - Bowing, rising and conduct at the bar table
    - Staying inside the pleadings or the grounds of appeal
    - Taking the bench to the appeal book and to authority

- name: Moot Preparation Worksheets
  file: moot-preparation-worksheets.docx
  format: Word document
  size: 28 KB
  updated: September 2026
  summary: >-
    Fill-in worksheets for a moot group to work through together, turning the guide into a
    written plan before the hearing.
  contents:
    - The finding you want, and your fallback position
    - Core submission in 75 words, and sorting the helpful and harmful facts
    - Oral plan with a time budget for each speaker
    - Anticipated questions and prepared answers
    - Practice-run debrief
