    - Starting from the order you are asking for, and building a theory of the case
    - The 75-word test for a core submission
    - Structure of an address: appearance, roadmap, submissions, conclusion
    - Handling questions from the bench, and returning to your argument
    - Timing, handovers and a pre-hearing checklist

- name: Moot Preparation Worksheets
  file: moot-preparation-worksheets.docx
  format: Word document
  size: 28 KB
  updated: September 2026
